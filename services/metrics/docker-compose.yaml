x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 15
  start_period: 3s
  start_interval: 1s

networks:
  net-grafana:
  net-loki:
  net-prometheus:
  net-vector:

volumes:
  grafana:
  lokidata:
  prometheus:
  vector:

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:?}
    restart: unless-stopped
    volumes:
      - ${PWD}/services/metrics/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    expose:
      - 9090
    networks:
      net-kafka:
      net-pgbouncer:
      net-pipeline:
      net-postgres:
      net-prometheus: { aliases: [prometheus.lokal] }
      net-tei:
      net-tmdb:
      net-vector:
      traefik:
    labels:
      - "traefik.enable=true"

      # Create the HTTP service for prometheus
      - "traefik.http.services.${TRAEFIK_SERVICE_PREFIX:?}_prometheus.loadBalancer.server.port=9090"

      # Create a router to expose prometheus service
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_prometheus.rule=Host(`prometheus.${TRAEFIK_BASE_DOMAIN:?}`)"
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_prometheus.tls=true"
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_prometheus.tls.certResolver=${TRAEFIK_ACME_RESOLVER:?}"
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_prometheus.entryPoints=${TRAEFIK_HTTPS_ENTRYPOINT:?}"
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_prometheus.service=${TRAEFIK_SERVICE_PREFIX:?}_prometheus"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, --spider, http://0.0.0.0:9090/-/ready]

  grafana-renderer:
    build:
      dockerfile_inline: |
        FROM ${GF_IMAGE_RENDERER_IMAGE:?} AS runtime
        COPY --from=${BUSYBOX_IMAGE:?} /bin/busybox /bin/busybox
    restart: unless-stopped
    networks:
      net-grafana: { aliases: [renderer.lokal] }
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      <<: *healthcheck
      test: [CMD, /bin/busybox, wget, -q, --spider, http://0.0.0.0:8081/health]

  grafana:
    image: ${GRAFANA_IMAGE:?}
    restart: unless-stopped
    volumes:
      - grafana:/var/lib/grafana
      - ${PWD}/services/metrics/grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - 3000
    networks:
      net-grafana: { aliases: [grafana.lokal] }
      net-loki:
      net-prometheus:
      traefik:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?}
      GF_SERVER_DOMAIN: grafana.${TRAEFIK_BASE_DOMAIN:?}
      GF_SERVER_ROOT_URL: https://grafana.${TRAEFIK_BASE_DOMAIN:?}
      GF_RENDERING_SERVER_URL: http://renderer.lokal:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana.lokal:3000/
    labels:
      - "traefik.enable=true"

      # Create the HTTP service for grafana
      - "traefik.http.services.${TRAEFIK_SERVICE_PREFIX:?}_grafana.loadBalancer.server.port=3000"

      # Create a router to expose grafana service
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_grafana.rule=Host(`grafana.${TRAEFIK_BASE_DOMAIN:?}`)"
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_grafana.tls=true"
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_grafana.tls.certResolver=${TRAEFIK_ACME_RESOLVER:?}"
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_grafana.entryPoints=${TRAEFIK_HTTPS_ENTRYPOINT:?}"
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_grafana.service=${TRAEFIK_SERVICE_PREFIX:?}_grafana"
    depends_on:
      grafana-renderer: { condition: service_healthy }
      loki: { condition: service_healthy }
      prometheus: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    healthcheck:
      <<: *healthcheck
      test: [CMD, curl, -fsSL, http://0.0.0.0:3000]

  loki:
    build:
      dockerfile_inline: |
        FROM ${GF_LOKI_IMAGE:?}
        COPY --from=${BUSYBOX_IMAGE:?} /bin/busybox /bin/busybox
    restart: unless-stopped
    command: [-config.file=/mnt/loki/config.yaml]
    volumes:
      - lokidata:/loki
      - ${PWD}/services/metrics/loki:/mnt/loki:ro
    expose:
      - 3100
    networks:
      net-loki: { aliases: [loki.lokal] }
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    healthcheck:
      <<: *healthcheck
      test: [CMD, /bin/busybox, wget, -q, --spider, http://0.0.0.0:3100/ready]

  vector:
    build:
      dockerfile_inline: |
        FROM ${VECTOR_IMAGE:?} AS runtime
        RUN apk add --no-cache jq rsync inotify-tools
        COPY --from=${GOMPLATE_IMAGE:?} /bin/gomplate /usr/local/bin/gomplate
    restart: unless-stopped
    entrypoint: /bin/sh
    user: root
    command: /app/entrypoint.sh
    environment:
      POSTGRES_URL: ${POSTGRES_URL:?}
    volumes:
      - ${PWD}/services/metrics/vector:/app:ro
      # Persistence
      - vector:/var/lib/vector
      # Log exporter – Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Log exporter – File
      - pglogs:/mnt/log/postgres:ro
      - tei_log:/mnt/log/tei:ro
      - tmdb_log:/mnt/log/tmdb:ro
      # Storage exporter – Executing `du -s` requires root
      - tei_cache:/mnt/cache/tei:ro
      - tmdb_cache:/mnt/cache/tmdb:ro
    networks:
      net-loki:
      net-vector: { aliases: [vector.lokal] }
    depends_on:
      loki: { condition: service_healthy }
      prometheus: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
    tmpfs:
      - /tmp
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, --spider, http://0.0.0.0:8686/health]
