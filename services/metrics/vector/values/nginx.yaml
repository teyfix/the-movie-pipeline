resources:
  - name: tei
    access_file: /mnt/log/tei/cache-proxy-access.jsonl
  - name: tmdb
    access_file: /mnt/log/tmdb/*-logs/cache-proxy-access.jsonl

metrics:
  variants:
    - name: connect
      field: uct
    - name: header
      field: uht
    - name: response
      field: urt

  tags:
    source: source
    proxy_host: proxy_host
    status: status
    cache: cache
    method: method
