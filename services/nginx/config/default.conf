log_format health_log escape=json
'{'
'"time":"$time_iso8601",'
'"remote_addr":"$remote_addr",'
'"method":"$request_method",'
'"uri":"$uri",'
'"args":"$args",'
'"status":$status,'
'"bytes_sent":$body_bytes_sent,'
'"rt":$request_time,'
'"user_agent":"$http_user_agent"'
'}';

log_format proxy_log escape=json
'{'
'"time":"$time_iso8601",'
'"remote_addr":"$remote_addr",'
'"method":"$request_method",'
'"uri":"$uri",'
'"args":"$args",'
'"status":$status,'
'"bytes_sent":$body_bytes_sent,'
'"proxy_host":"$proxy_host",'
'"rt":$request_time,'
'"uct":"$upstream_connect_time",'
'"uht":"$upstream_header_time",'
'"urt":"$upstream_response_time",'
'"cache":"$upstream_cache_status",'
'"user_agent":"$http_user_agent"'
'}';

gzip on;
gunzip on;


# Standard proxy headers
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Docker's internal DNS resolver is strictly required for variable-based proxy_pass
resolver 127.0.0.11 valid=10s ipv6=off;

# Access log
access_log /var/log/nginx/nginx_proxy_access.log proxy_log;
error_log /var/log/nginx/nginx_proxy_error.log;

server {
  listen 4000;

  access_log /var/log/nginx/health_access.log health_log;
  error_log /var/log/nginx/health_error.log;

  location /health {
    return 200;
  }
}

# ==========================================
# 1. Prometheus (9090)
# URL: http://prometheus.127-0-0-1.sslip.io:8000
# ==========================================
server {
  listen 8000;
  server_name prometheus.127-0-0-1.sslip.io;
  set $service_url http://prometheus.lokal:9090;

  location / {
    proxy_pass $service_url;
  }
}

