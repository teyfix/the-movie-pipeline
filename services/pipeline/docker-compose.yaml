x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 15
  start_period: 3s
  start_interval: 1s

x-pipeline: &pipeline
  build:
    context: ${PWD}/services/pipeline
    target: connect
  working_dir: /app
  volumes:
    - ${PWD}/services/pipeline/app:/app:ro
    - ${PWD}/services/pipeline/config:/config:ro

x-common-env: &common-env
  KAFKA_BROKERS: ${KAFKA_BROKERS:?}

networks:
  net-pipeline:

services:
  kafka-init:
    build:
      context: ${PWD}/services/pipeline
      target: kafka-init
    volumes:
      - ${PWD}/services/pipeline/app:/app:ro
    restart: on-failure
    environment:
      <<: *common-env
      KAFKA_CLEANUP_POLICY: ${KAFKA_CLEANUP_POLICY:?}
      KAFKA_COMPRESSION_TYPE: ${KAFKA_COMPRESSION_TYPE:?}
      KAFKA_MAX_MESSAGE_BYTES: ${KAFKA_MAX_MESSAGE_BYTES:?}
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:?}
    networks:
      net-kafka:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
    depends_on:
      redpanda: { condition: service_healthy }
    labels:
      # Enable collecting logs
      - "tmdb.log.enable=true"

  seed:
    <<: *pipeline
    build:
      context: ${PWD}/services/pipeline
      target: seed
    restart: unless-stopped
    environment:
      <<: *common-env
      PIPELINE_CONFIG: /config/seed.yaml
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      DATADIR_TMDB: /downloads
      TMDB_FILES_API_URL: http://tmdb-files.lokal:8080
    volumes:
      - ${PWD}/services/pipeline/app:/app:ro
      - ${PWD}/services/pipeline/config:/config:ro
      - ${PWD}/.cache/tmdb/exports:/downloads
      - ${PWD}/.state/pipeline/data/seed:/data
      - ${PWD}/.state/pipeline/logs/seed:/var/log/vector
    networks:
      net-kafka:
      net-pipeline: { aliases: [seed.lokal] }
      net-tmdb:
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
      tmdb-files: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    labels:
      # Enable collecting logs
      - "tmdb.log.enable=true"
    healthcheck:
      <<: *healthcheck
      test: [CMD, /usr/local/libexec/teyfix/pipeline/healthcheck.sh]

  enrich:
    <<: *pipeline
    volumes:
      - ${PWD}/services/pipeline/app:/app:ro
      - ${PWD}/services/pipeline/config:/config:ro
      - ${PWD}/.state/pipeline/data/enrich:/data
      - ${PWD}/.state/pipeline/logs/enrich:/var/log/redpanda-connect
    restart: unless-stopped
    environment:
      <<: *common-env
      PIPELINE_CONFIG: /config/enrich.yaml
      TMDB_API_URL: http://tmdb.lokal:8080
    networks:
      net-kafka:
      net-pipeline: { aliases: [enrich.lokal] }
      net-tmdb:
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
      tmdb: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    labels:
      # Enable collecting logs
      - "tmdb.log.enable=true"
    healthcheck:
      <<: *healthcheck
      test: [CMD, /usr/local/libexec/teyfix/pipeline/healthcheck.sh]

  normalize:
    <<: *pipeline
    volumes:
      - ${PWD}/services/pipeline/app:/app:ro
      - ${PWD}/services/pipeline/config:/config:ro
      - ${PWD}/.state/pipeline/data/normalize:/data
      - ${PWD}/.state/pipeline/logs/normalize:/var/log/redpanda-connect
    restart: unless-stopped
    environment:
      <<: *common-env
      PIPELINE_CONFIG: /config/normalize.yaml
    networks:
      net-kafka:
      net-pipeline: { aliases: [normalize.lokal] }
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: "${NORMALIZE_RESOURCE_CPU:?}"
          memory: ${NORMALIZE_RESOURCE_MEM:?}
    labels:
      # Enable collecting logs
      - "tmdb.log.enable=true"
    healthcheck:
      <<: *healthcheck
      test: [CMD, /usr/local/libexec/teyfix/pipeline/healthcheck.sh]

  embed:
    <<: *pipeline
    volumes:
      - ${PWD}/services/pipeline/app:/app:ro
      - ${PWD}/services/pipeline/config:/config:ro
      - ${PWD}/.state/pipeline/data/embed:/data
      - ${PWD}/.state/pipeline/logs/embed:/var/log/redpanda-connect
    restart: unless-stopped
    environment:
      <<: *common-env
      PIPELINE_CONFIG: /config/embed.yaml
      TEI_API_URL: http://tei.lokal:8080
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:?}
    networks:
      net-kafka:
      net-pipeline: { aliases: [embed.lokal] }
      net-tei:
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      tei: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    labels:
      # Enable collecting logs
      - "tmdb.log.enable=true"
    healthcheck:
      <<: *healthcheck
      test: [CMD, /usr/local/libexec/teyfix/pipeline/healthcheck.sh]
    profiles:
      - embed

  ingest:
    <<: *pipeline
    volumes:
      - ${PWD}/services/pipeline/app:/app:ro
      - ${PWD}/services/pipeline/config:/config:ro
      - ${PWD}/.state/pipeline/data/ingest:/data
      - ${PWD}/.state/pipeline/logs/ingest:/var/log/redpanda-connect
    restart: unless-stopped
    environment:
      <<: *common-env
      PIPELINE_CONFIG: /config/ingest.yaml
      PG_SCHEMA: ${PG_SCHEMA:?}
      POSTGRES_URL: postgresql://${PG_USER:?}:${PG_PASSWORD:?}@pgbouncer.lokal:6432/${POSTGRES_DB:?}?sslmode=disable
      INGEST_MAX_IN_FLIGHT: ${INGEST_MAX_IN_FLIGHT:?}
      INGEST_CONN_MAX_OPEN: ${INGEST_CONN_MAX_OPEN:?}
      INGEST_CONN_MAX_IDLE: ${INGEST_CONN_MAX_IDLE:?}
      INGEST_CONN_MAX_LIFE_TIME: ${INGEST_CONN_MAX_LIFE_TIME:?}
      EMBEDDING_DIMENSIONS_MAX: ${EMBEDDING_DIMENSIONS_MAX:?}
    networks:
      net-kafka:
      net-pgbouncer:
      net-pipeline: { aliases: [ingest.lokal] }
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: "${INGEST_RESOURCE_CPU:?}"
          memory: ${INGEST_RESOURCE_MEM:?}
    labels:
      # Enable collecting logs
      - "tmdb.log.enable=true"
    healthcheck:
      <<: *healthcheck
      test: [CMD, /usr/local/libexec/teyfix/pipeline/healthcheck.sh]
