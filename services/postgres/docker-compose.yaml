x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 15
  start_period: 3s
  start_interval: 1s

volumes:
  pgadmin:

networks:
  net-pgadmin:
  net-pgbouncer:
  net-postgres:

services:
  postgres:
    image: teyfix/postgres:sha-208d7e1e9017793d5d1e7a4cc90c54a1de2f55f5
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PG_PASSWORD: ${PG_PASSWORD:?}
    volumes:
      - ${PWD}/services/postgres/config:/config:ro
      - ${PWD}/.state/postgres/data:/var/lib/postgresql/data
      - ${PWD}/.state/postgres/logs:/var/log/postgresql
      - ${PWD}/.state/postgres/pooler-logs:/var/log/pgbouncer
    expose: [5432, 6432, 9187, 9127]
    networks:
      net-postgres: { aliases: [postgres.lokal] }
      net-pgbouncer: { aliases: [pgbouncer.lokal] }
      traefik:
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_RESOURCE_CPU:?}"
          memory: "${POSTGRES_RESOURCE_MEM:?}"
    shm_size: "${POSTGRES_RESOURCE_SHM:?}"
    labels:
      # Enable Traefik

      # Create the TCP service for PostgreSQL
      - "traefik.tcp.services.${TRAEFIK_SERVICE_PREFIX:?}_pg.loadBalancer.server.port=5432"

      # Create a router to expose the PostgreSQL service
      - "traefik.tcp.routers.${TRAEFIK_SERVICE_PREFIX:?}_pg.rule=HostSNI(`pg.${TRAEFIK_BASE_DOMAIN:?}`)"
      - "traefik.tcp.routers.${TRAEFIK_SERVICE_PREFIX:?}_pg.tls=true"
      - "traefik.tcp.routers.${TRAEFIK_SERVICE_PREFIX:?}_pg.tls.certResolver=${TRAEFIK_ACME_RESOLVER:?}"
      - "traefik.tcp.routers.${TRAEFIK_SERVICE_PREFIX:?}_pg.entryPoints=${TRAEFIK_TCP_ENTRYPOINT:?}"
      - "traefik.tcp.routers.${TRAEFIK_SERVICE_PREFIX:?}_pg.service=${TRAEFIK_SERVICE_PREFIX:?}_pg"
      - "traefik.enable=true"

      # Create the TCP service for PostgreSQL
      - "traefik.tcp.services.${TRAEFIK_SERVICE_PREFIX:?}_pgbouncer.loadBalancer.server.port=6432"

      # Create a router to expose the PostgreSQL service
      - "traefik.tcp.routers.${TRAEFIK_SERVICE_PREFIX:?}_pgbouncer.rule=HostSNI(`pgbouncer.${TRAEFIK_BASE_DOMAIN:?}`)"
      - "traefik.tcp.routers.${TRAEFIK_SERVICE_PREFIX:?}_pgbouncer.tls=true"
      - "traefik.tcp.routers.${TRAEFIK_SERVICE_PREFIX:?}_pgbouncer.tls.certResolver=${TRAEFIK_ACME_RESOLVER:?}"
      - "traefik.tcp.routers.${TRAEFIK_SERVICE_PREFIX:?}_pgbouncer.entryPoints=${TRAEFIK_TCP_ENTRYPOINT:?}"
      - "traefik.tcp.routers.${TRAEFIK_SERVICE_PREFIX:?}_pgbouncer.service=${TRAEFIK_SERVICE_PREFIX:?}_pgbouncer"

  postgres-sql:
    image: burningalchemist/sql_exporter:0.24.10
    restart: unless-stopped
    command: [--config.file=/config/sql-exporter.yaml, --web.listen-address=:9399]
    environment:
      SQLEXPORTER_TARGET_DSN: postgresql://${PG_USER:?}:${PG_PASSWORD:?}@postgres.lokal:5432/${POSTGRES_DB:?}?sslmode=disable
    volumes:
      - ${PWD}/services/postgres/metrics:/config:ro
    expose: [9399]
    networks:
      net-postgres: { aliases: [postgres-sql.lokal] }
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

  pgadmin:
    image: ${PGADMIN_IMAGE:?}
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?}
    volumes:
      - ${PWD}/services/postgres/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin:/var/lib/pgadmin
    networks:
      net-pgadmin: { aliases: [pgadmin.lokal] }
      net-postgres:
      traefik:
    labels:
      - "traefik.enable=true"

      # Create the HTTP service for pgAdmin
      - "traefik.http.services.${TRAEFIK_SERVICE_PREFIX:?}_pgadmin.loadBalancer.server.port=80"

      # Create a router to expose pgAdmin service
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_pgadmin.rule=Host(`pgadmin.${TRAEFIK_BASE_DOMAIN:?}`)"
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_pgadmin.tls=true"
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_pgadmin.tls.certResolver=${TRAEFIK_ACME_RESOLVER:?}"
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_pgadmin.entryPoints=${TRAEFIK_HTTPS_ENTRYPOINT:?}"
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_pgadmin.service=${TRAEFIK_SERVICE_PREFIX:?}_pgadmin"
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, --spider, http://0.0.0.0/misc/ping]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
