x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 15
  start_period: 3s
  start_interval: 1s

networks:
  net-tei:

configs:
  tei-routes:
    content: |
      routes:
        - name: embeddings
          upstream: http://tei-server.lokal:8080
          match: exact
          prefix: /embed
          cache:
            methods: [POST]
            ttl: 1d
            ttl_mode: override
            inactive: 30d
            max_size: 1g
            status_ttl: {"201": 1d, "204": 1d}
            key:
              namespace: "${EMBEDDING_MODEL:?}"
            lock: {timeout: 30s, age: 30s}
            stale: [error, timeout, http_500, http_502, http_503, http_504]
        - name: inference_passthrough
          upstream: http://tei-server.lokal:8080
          cache:
            enabled: false

services:
  tei-server:
    image: ${HF_TEI_IMAGE:?}
    command: ["--model-id", "$EMBEDDING_MODEL"]
    restart: unless-stopped
    environment:
      PORT: 8080
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?}
    volumes:
      - ${PWD}/.cache/tei/models:/data
    expose:
      - 8080
    networks:
      net-tei: { aliases: [tei-server.lokal] }
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          cpus: "0.5"
          memory: 2G
    healthcheck:
      <<: *healthcheck
      # Make room for downloading the model (10m)
      retries: 100
      start_interval: 6s
      test: [CMD, curl, -fsSL, http://0.0.0.0:8080/health]

  tei:
    image: teyfix/cache-proxy:sha-208d7e1e9017793d5d1e7a4cc90c54a1de2f55f5
    restart: unless-stopped
    volumes:
      - ${PWD}/.state/tei/logs:/var/log/nginx
      - ${PWD}/.cache/tei/responses:/var/cache/nginx
    configs:
      - source: tei-routes
        target: /config/routes.yaml
    expose:
      - 8080
    networks:
      net-tei: { aliases: [tei.lokal] }
      traefik:
    labels:
      - "traefik.enable=true"

      # Create the HTTP service for TEI server
      - "traefik.http.services.${TRAEFIK_SERVICE_PREFIX:?}_tei.loadBalancer.server.port=8080"

      # Create a router to expose TEI service
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_tei.rule=Host(`tei.${TRAEFIK_BASE_DOMAIN:?}`)"
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_tei.tls=true"
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_tei.tls.certResolver=${TRAEFIK_ACME_RESOLVER:?}"
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_tei.entryPoints=${TRAEFIK_HTTPS_ENTRYPOINT:?}"
      - "traefik.http.routers.${TRAEFIK_SERVICE_PREFIX:?}_tei.service=${TRAEFIK_SERVICE_PREFIX:?}_tei"
    depends_on:
      tei-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
