# ---------------------------------------------------------------------------
# Cache storage configuration
# ---------------------------------------------------------------------------
# levels=1:2         Two-level directory hierarchy to avoid too many files
#                    in a single directory (e.g. .../a/bc/<hash>)
# keys_zone=tei_cache:10m  In-memory hash table for cache keys.
#                    10MB holds ~80k–100k keys. The zone name must match
#                    proxy_cache below.
# max_size=1g        Hard cap on total disk usage. nginx evicts least
#                    recently used entries (LRU) when this is reached.
# inactive=30d       Evict entries not accessed within 30 days,
#                    regardless of max_size. Embedding responses are large
#                    so 30d keeps the cache lean without thrashing.
# use_temp_path=off  Write temp files directly into the cache directory
#                    instead of a separate temp path, avoiding an extra
#                    file move on every cache write (faster, fewer inodes).
proxy_cache_path /var/cache/tei levels=1:2 keys_zone=tei_cache:10m max_size=1g inactive=30d use_temp_path=off;

log_format health_log escape=json
'{'
'"time":"$time_iso8601",'
'"remote_addr":"$remote_addr",'
'"method":"$request_method",'
'"uri":"$uri",'
'"args":"$args",'
'"status":$status,'
'"bytes_sent":$body_bytes_sent,'
'"rt":$request_time,'
'"user_agent":"$http_user_agent"'
'}';

log_format cache_log escape=json
'{'
'"time":"$time_iso8601",'
'"remote_addr":"$remote_addr",'
'"method":"$request_method",'
'"uri":"$uri",'
'"args":"$args",'
'"status":$status,'
'"bytes_sent":$body_bytes_sent,'
'"proxy_host":"$proxy_host",'
'"rt":$request_time,'
'"uct":"$upstream_connect_time",'
'"uht":"$upstream_header_time",'
'"urt":"$upstream_response_time",'
'"cache":"$upstream_cache_status",'
'"user_agent":"$http_user_agent"'
'}';

access_log off;
error_log off;

server {
  listen 4000;
  listen [::]:4000;

  access_log /var/log/nginx/health_access.log health_log;
  error_log /var/log/nginx/health_error.log;

  location /health {
    return 200;
  }
}


server {
  listen 8080;
  listen [::]:8080;


  access_log /var/log/nginx/tei_access.log cache_log;
  error_log /var/log/nginx/tei_error.log;

  location / {
    # -----------------------------------------------------------------------
    # Observability
    # -----------------------------------------------------------------------
    # Exposes the cache state in the response header so callers (and you)
    # can verify caching is working. Possible values:
    #   HIT     — served from cache, GPU was not touched
    #   MISS    — not in cache, request forwarded to TEI
    #   BYPASS  — cache was intentionally skipped (not applicable here)
    #   EXPIRED — cached entry existed but was stale, TEI was re-queried
    #   UPDATING— stale entry being served while a background refresh runs
    #             (only possible with proxy_cache_use_stale updating)
    add_header X-Cache-Status $upstream_cache_status;

    # -----------------------------------------------------------------------
    # Request body buffering
    # -----------------------------------------------------------------------
    # nginx must fully buffer the request body before it can compute the
    # cache key (which includes $request_body). Without this, the body may
    # not be read before the cache lookup, causing $request_body to be empty
    # and all POST requests to collide on the same cache key.
    #
    # proxy_buffer_size  Buffer for the first chunk of the response
    #                    (typically the response headers + start of body).
    #                    128k is generous for JSON embedding responses.
    # proxy_buffers      4 buffers × 256k = 1MB total per request. Sized
    #                    for typical embedding responses (1024-dim float32 =
    #                    ~4KB, well within a single buffer).
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;

    # -----------------------------------------------------------------------
    # Upstream cache-control bypass
    # -----------------------------------------------------------------------
    # TEI sets Cache-Control: no-store on its responses by default. Without
    # this directive nginx would honour that header and skip caching entirely,
    # making the cache zone above completely ineffective. We take full control
    # of caching policy regardless of what TEI says.
    proxy_ignore_headers Cache-Control Expires Set-Cookie;

    # -----------------------------------------------------------------------
    # Cache behaviour
    # -----------------------------------------------------------------------
    # Activate the cache zone defined above.
    proxy_cache tei_cache;

    # Cache key for POST requests. Segments are pipe-delimited for clarity:
    #   ${EMBEDDING_MODEL}  — model name injected at container start via
    #                         envsubst. Ensures embeddings from different
    #                         models never collide (critical if you ever
    #                         run multiple TEI instances behind one nginx).
    #   $scheme$proxy_host$uri$is_args$args  — standard URL components,
    #                         included for correctness even though TEI only
    #                         exposes one endpoint (/embed).
    #   $request_body       — the actual text being embedded. This is the
    #                         primary cache discriminator: identical inputs
    #                         produce identical embeddings, so this gives
    #                         us idempotent caching for free.
    proxy_cache_key "${EMBEDDING_MODEL}|$scheme$proxy_host$uri$is_args$args|$request_body";

    # Enable caching for POST requests. nginx only caches GET/HEAD by
    # default. TEI's /embed endpoint is POST-only, so this is required.
    proxy_cache_methods POST;

    # Cache successful responses for 1 day. Embeddings are deterministic
    # for a given model + input, so they never need to expire unless the
    # model changes (handled by the model name in the cache key above).
    proxy_cache_valid 200 201 204 1d;

    # Prevent cache stampede (thundering herd). When multiple identical
    # requests arrive simultaneously for an uncached key, only the first
    # is forwarded to TEI. The rest wait for the cache to be populated,
    # then serve from cache. Without this, all concurrent requests would
    # hit the GPU simultaneously.
    proxy_cache_lock on;

    # -----------------------------------------------------------------------
    # Stale cache behaviour
    # -----------------------------------------------------------------------
    # Serve a stale (expired) cached response instead of returning an error
    # when the upstream is unavailable. Conditions:
    #   error      — TEI is unreachable or dropped the connection
    #   timeout    — TEI took too long to respond (e.g. GPU saturated)
    #   http_5xx   — TEI returned a server error (e.g. OOM on GPU)
    # Note: "updating" is intentionally omitted. proxy_cache_background_update
    # is not enabled here because nginx background refresh only works for
    # GET/HEAD requests, and TEI's /embed endpoint is POST-only. Including
    # "updating" would be dead code and misleading.
    # Note: we intentionally omit http_404 — a 404 from TEI means the
    # endpoint doesn't exist, which is a config error not worth caching.
    proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;

    # -----------------------------------------------------------------------
    # Cache lock timeouts
    # -----------------------------------------------------------------------
    # proxy_cache_lock_timeout: how long a waiting request will queue before
    #   giving up and going directly to the upstream (bypassing the lock).
    # proxy_cache_lock_age: how long the lock holder is allowed before the
    #   next waiter takes over the upstream request.
    # Both are set to 30s to cover worst-case GPU inference latency. The
    # nginx default of 5s is far too short for cold embedding requests and
    # would cause the stampede guard to leak under GPU load.
    proxy_cache_lock_timeout 30s;
    proxy_cache_lock_age 30s;

    # -----------------------------------------------------------------------
    # Upstream
    # -----------------------------------------------------------------------
    # Forward to the TEI server on the private Docker network. Plain HTTP
    # because both containers are on the same internal network (tei-server.lokal);
    # TLS would add overhead with no security benefit here.
    proxy_pass http://tei-server.lokal:8080;

    # Rewrite Location headers in redirects to point to this proxy rather
    # than the upstream. "default" means rewrite to the current server's
    # host/port. Included for correctness; TEI does not issue redirects
    # in normal operation.
    proxy_redirect default;
  }
}
