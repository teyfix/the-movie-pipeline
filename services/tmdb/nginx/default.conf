# Define shared cache storage
# - levels=1:2 → directory sharding to avoid too many files per folder
# - keys_zone=tmdb_cache:250m → in-memory index (~10MB ≈ ~80k–100k keys)
# - max_size=20g → hard cap on disk usage (LRU eviction beyond this)
# - inactive=1d → evict entries not accessed for 1 day
# - use_temp_path=off → write temp files directly into cache dir (faster, fewer disk moves)
proxy_cache_path /var/cache/tmdb_api levels=1:2 keys_zone=tmdb_api:500m max_size=20g inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/tmdb_files levels=1:2 keys_zone=tmdb_files:1m max_size=2g inactive=30d use_temp_path=off;

log_format health_log escape=json
'{'
'"time":"$time_iso8601",'
'"remote_addr":"$remote_addr",'
'"method":"$request_method",'
'"uri":"$uri",'
'"args":"$args",'
'"status":$status,'
'"bytes_sent":$body_bytes_sent,'
'"rt":$request_time,'
'"user_agent":"$http_user_agent"'
'}';

log_format cache_log escape=json
'{'
'"time":"$time_iso8601",'
'"remote_addr":"$remote_addr",'
'"method":"$request_method",'
'"uri":"$uri",'
'"args":"$args",'
'"status":$status,'
'"bytes_sent":$body_bytes_sent,'
'"proxy_host":"$proxy_host",'
'"rt":$request_time,'
'"uct":"$upstream_connect_time",'
'"uht":"$upstream_header_time",'
'"urt":"$upstream_response_time",'
'"cache":"$upstream_cache_status",'
'"user_agent":"$http_user_agent"'
'}';

gzip on;
gunzip on;

access_log off;
error_log off;

server {
  listen 4000;
  listen [::]:4000;

  access_log /var/log/nginx/health_access.log health_log;
  error_log /var/log/nginx/health_error.log;

  location /health {
    return 200;
  }
}

server {
  listen 8080;
  listen [::]:8080;

  set $tmdb_api api.themoviedb.org;
  resolver 1.1.1.1 valid=30s ipv6=off;
  access_log /var/log/nginx/tmdb_api_access.log cache_log;
  error_log /var/log/nginx/tmdb_api_error.log;

  location / {
    # Reuse shared proxy + caching behavior (DNS, headers, cache policy, etc.)
    include /etc/nginx/snippets/proxy_cache.conf;

    # Upstream: TMDB API (served via CloudFront)
    # proxy_pass defines target origin
    proxy_pass https://$tmdb_api;

    # Force Host header to match upstream expectation
    # Required for CDNs / virtual hosts (otherwise 403 or wrong content)
    proxy_set_header Host $tmdb_api;

    # Explicit SNI value for TLS handshake (must match Host for CDNs)
    proxy_ssl_name $tmdb_api;

    # Use cache zone defined via proxy_cache_path
    proxy_cache tmdb_api;
  }
}


server {
  listen 9090;
  listen [::]:9090;

  set $tmdb_files files.tmdb.org;
  resolver 1.1.1.1 valid=30s ipv6=off;
  access_log /var/log/nginx/tmdb_files_access.log cache_log;
  error_log /var/log/nginx/tmdb_files_error.log;

  location / {
    # Same caching + proxy behavior reused for a different upstream
    include /etc/nginx/snippets/proxy_cache.conf;

    # Upstream: TMDB static assets (daily exports)
    proxy_pass https://$tmdb_files;

    # Ensure correct Host header for this origin
    proxy_set_header Host $tmdb_files;

    # Match SNI to upstream hostname for proper TLS routing
    proxy_ssl_name $tmdb_files;

    # Use cache zone defined via proxy_cache_path
    proxy_cache tmdb_files;
  }
}
