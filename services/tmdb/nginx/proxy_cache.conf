# Surface cache behavior for debugging (HIT, MISS, BYPASS, EXPIRED, etc.)
# Useful when verifying cache effectiveness under load
add_header X-Cache-Status $upstream_cache_status;

# Enable SNI so upstream TLS (e.g. CloudFront / TMDB) serves correct cert
# Without this, you may get SSL errors or wrong virtual host
proxy_ssl_server_name on;

# Reuse SSL sessions for better performance (less TLS handshake overhead)
proxy_ssl_session_reuse on;

# Strip forwarding headers injected by Traefik
# Prevents upstreams from seeing internal routing context or mismatched hosts
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Forwarded-Proto "";
proxy_set_header X-Real-IP "";
proxy_set_header Referer "";

# Overwrite Accept-Encoding to store gzip-encoded responses
proxy_set_header Accept-Encoding "gzip";

# Ignore upstream cache-control headers
# We take full control of caching policy regardless of origin intent
# (useful for APIs like TMDB that may disable caching)
proxy_ignore_headers Cache-Control Expires Set-Cookie;

# Cache key definition
proxy_cache_key "$proxy_host|$uri|$is_args|$args";

# Prevent cache stampede: only one request populates cache, others wait
proxy_cache_lock on;

# Cache success responses aggressively
proxy_cache_valid 200 201 204 30d;

# Cache 404s to avoid repeated misses (common for sparse datasets)
proxy_cache_valid 404 1h;

# Cache upstream errors briefly to protect origin during instability
proxy_cache_valid 500 502 503 504 1m;

# Serve stale cache when upstream fails or is slow
# "updating" allows background refresh while stale response is served
proxy_cache_use_stale error timeout updating http_404 http_500 http_502 http_503 http_504;

# Efficiency
proxy_cache_background_update on;
# lock_timeout: how long a waiting request will queue before giving up and going to upstream directly.
# lock_age: how long the lock holder is allowed before the next waiter takes over the upstream request.
# Both must exceed proxy_connect_timeout (5s) + proxy_read_timeout (15s) = 20s to prevent the
# stampede guard from leaking under slow upstream responses.
proxy_cache_lock_timeout 30s;
proxy_cache_lock_age 30s;

proxy_buffer_size 64k;
proxy_buffers 16 64k;
proxy_busy_buffers_size 128k;

proxy_connect_timeout 5s;
proxy_read_timeout 15s;
proxy_send_timeout 5s;
